name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @tactico/jevbridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+. Node 22 ships npm 10.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Typecheck
        run: |
          npm install --no-save --no-package-lock typescript@5.6.3 @types/node@22
          npx tsc --noEmit --pretty false
      - name: Test
        run: npm test
      - name: Publish
        # No NODE_AUTH_TOKEN. An empty token blocks OIDC fallback.
        # Provenance is automatic when publishing via trusted publishing.
        run: npm publish --access public
